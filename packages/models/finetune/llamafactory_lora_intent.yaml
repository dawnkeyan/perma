# LLaMA-Factory · 意图识别 LoRA 微调配置（备选方案）
#
# 用法：
#   pip install llamafactory-cli
#   llamafactory-cli train packages/models/finetune/llamafactory_lora_intent.yaml
#
# 什么时候用 LLaMA-Factory 而不是 ms-swift：
#   - 需要同时支持更多基座（Llama / Mistral / GLM 等）时
#   - 团队已有 LLaMA-Factory 的部署与使用习惯
#   - 需要 WebUI 可视化调参
#
# 主方案仍是 ms-swift（Qwen 生态 + 魔搭集成更好），本文件用于对拍验证：
# 两套框架在同一数据集上的结果差异，可作为训练结果稳定性的旁证。

### model
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
# 与 ms-swift 使用同一份数据，保证对比有效
dataset: data/sft/train.jsonl
eval_dataset: data/sft/val.jsonl
dataset_dir: data
template: qwen
cutoff_len: 1024
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: output/llamafactory-intent-lora
logging_steps: 50
save_steps: 100
plot_loss: true
overwrite_output_dir: true
save_total_limit: 3

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
seed: 42

### eval
val_size: 0.1
per_device_eval_batch_size: 16
eval_strategy: steps
eval_steps: 100
# 关键：把意图分类的准确率作为主指标，而不是训练 loss
metric_for_best_model: eval_loss
greater_is_better: false

### infer
# 训练后用 vllm 部署，参考 packages/models/README.md 的部署章节
infer_dtype: bfloat16
