# Lumina · 生产编排
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   make up-prod
#
# 与开发编排的差异：
#   1. 关闭所有源码挂载与热重载
#   2. 强制开启全部 profile
#   3. 资源限制与日志限制
#   4. 只暴露 nginx（80/443），内部服务不映射宿主机端口
name: lumina

x-restart: &restart
  restart: unless-stopped

x-limits: &api-limits
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
      reservations:
        memory: 512M

x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?生产环境必须显式设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产环境必须显式设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lumina}
    logging: *prod-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-lumina}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 生产环境不暴露宿主机端口，仅容器网络内可达
    expose: ["5432"]

  redis:
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?生产环境必须显式设置 REDIS_PASSWORD}
    logging: *prod-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    expose: ["6379"]

  api:
    image: ${LUMINA_IMAGE:-ghcr.io/your-org/lumina:latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      APP_ENV: production
      LOG_FORMAT: json
      DEBUG: "false"
      # 生产必须走 https 才有意义
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-api.lumina.example.com}
      # Redis 启用密码时，连接串必须带上凭证
      REDIS_URL: redis://:${REDIS_PASSWORD:?生产环境必须显式设置 REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *prod-logging
    <<: *api-limits

  worker:
    image: ${LUMINA_IMAGE:-ghcr.io/your-org/lumina:latest}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      APP_ENV: production
      LOG_FORMAT: json
      REDIS_URL: redis://:${REDIS_PASSWORD:?生产环境必须显式设置 REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["8001"]
    logging: *prod-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ./ops/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api: { condition: service_healthy }
    logging: *prod-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    logging: *prod-logging
    deploy:
      resources:
        limits:
          memory: 2G

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?生产环境必须显式设置 GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    logging: *prod-logging
    deploy:
      resources:
        limits:
          memory: 512M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./ops/otel/otel-collector.yaml:/etc/otel/config.yaml:ro
    logging: *prod-logging
    deploy:
      resources:
        limits:
          memory: 512M

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    restart: unless-stopped
    environment:
      MODEL_ID: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - hf-cache:/data
    logging: *prod-logging
    deploy:
      resources:
        limits:
          memory: 2G

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - esdata:/usr/share/elasticsearch/data
    logging: *prod-logging
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  pgdata:
  redisdata:
  esdata:
  promdata:
  grafanadata:
  hf-cache:

networks:
  lumina:
    driver: bridge
