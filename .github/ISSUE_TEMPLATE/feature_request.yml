name: 功能建议
description: 提出一个新功能或改进
labels: ["enhancement", "待讨论"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户的具体场景与痛点，而不是解决方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: |
        用「给定 X，当 Y，则 Z」的格式写 1~3 条。
        没有验收标准的建议会先被退回补充。
      value: |
        - 给定…，当…，则…
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 客户端
        - API
        - 检索 / RAG
        - Agent 编排
        - Prompt
        - 模型与部署
        - 评测与质量
        - 基础设施
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 范围
      options:
        - label: 这是 v0.1（MVP）范围内必须的功能
        - label: 这是 v0.2+ 的功能
