name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: 后端质量门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 代码风格 (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: 静态类型 (mypy)
        run: mypy app

      - name: 单元测试
        run: pytest -q --cov=app --cov-report=xml --cov-report=term-missing -m "not integration"

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: services/api/coverage.xml
          retention-days: 7

  frontend:
    name: 小程序质量门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/miniapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/miniapp/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 构建
        run: npm run build:weapp

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-dist
          path: apps/miniapp/dist
          retention-days: 7

  eval:
    name: 离线评测门禁
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: 安装依赖
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跑评测
        working-directory: services/api
        env:
          LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.EVAL_LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.EVAL_LLM_MODEL || 'qwen-plus' }}
        run: |
          python -m app.eval.runner \
            --dataset ../../packages/datasets/golden \
            --out ../../reports/eval/current.json

      - name: 门禁比对
        working-directory: services/api
        run: |
          python -m app.eval.gate \
            --current ../../reports/eval/current.json \
            --baseline ../../packages/datasets/golden/snapshot/baseline.json

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/eval/current.json
          retention-days: 14

  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 依赖漏洞扫描
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: 密钥泄露扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
