upstream lumina_api {
    server api:8000;
    keepalive 32;
}

# 限流区
limit_req_zone $binary_remote_addr zone=chat_zone:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.lumina.app;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;
    limit_conn conn_zone 20;

    # 访问日志（含 trace id，便于与后端日志对齐）
    log_format lumina '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'trace=$upstream_http_x_trace_id';
    access_log /var/log/nginx/lumina.access.log lumina;

    location / {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://lumina_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 流式对话：必须关闭缓冲，否则 SSE 会被攒着一次性吐出
    location /v1/chat/stream {
        limit_req zone=chat_zone burst=10 nodelay;
        proxy_pass http://lumina_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://lumina_api;
    }

    location /healthz {
        access_log off;
        proxy_pass http://lumina_api;
    }
}
