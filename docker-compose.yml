name: lumina

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  TZ: ${TZ:-Asia/Shanghai}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-change-me-in-env}@postgres:5432/${POSTGRES_DB:-lumina}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  LLM_API_KEY: ${LLM_API_KEY:-sk-placeholder}
  LLM_MODEL: ${LLM_MODEL:-qwen-plus}
  LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-qwen-turbo}
  LLM_LOCAL_ENABLED: ${LLM_LOCAL_ENABLED:-true}
  LLM_LOCAL_BASE_URL: ${LLM_LOCAL_BASE_URL:-http://vllm:8000/v1}
  LLM_LOCAL_MODEL: ${LLM_LOCAL_MODEL:-lumina-intent-lora}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8000/v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  SEARCH_BACKEND: ${SEARCH_BACKEND:-elasticsearch}
  ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
  ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-lumina-kb}
  RERANK_ENABLED: ${RERANK_ENABLED:-true}
  RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
  SAFETY_CRISIS_DETECTION: ${SAFETY_CRISIS_DETECTION:-true}
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lumina-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      POSTGRES_DB: ${POSTGRES_DB:-lumina}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
      - -c
      - work_mem=16MB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumina} -d ${POSTGRES_DB:-lumina}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [lumina]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [lumina]
    logging: *default-logging

  # 轻量 BM25 检索：Quickwit（Rust 实现，ES 兼容 API，内存占用仅为 ES 的 1/10）
  # 资源紧张或需要完整 ES 生态时可切换到 elasticsearch 服务
  quickwit:
    image: quickwit/quickwit:latest
    container_name: lumina-quickwit
    profiles: ["quickwit"]
    environment:
      QW_LISTEN_ADDRESS: 0.0.0.0:6333
      QW_DATA_DIR: /qwit
      QW_CLUSTER_ID: lumina
    volumes:
      - quickwitdata:/qwit
    networks: [lumina]
    logging: *default-logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: lumina-es
    profiles: ["search"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks: [lumina]
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: ops/docker/api.Dockerfile
      target: runtime
    container_name: lumina-api
    env_file: [.env]
    environment: *common-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [lumina]
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: ops/docker/api.Dockerfile
      target: runtime
    container_name: lumina-worker
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment: *common-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [lumina]
    logging: *default-logging

  nginx:
    image: nginx:1.25-alpine
    container_name: lumina-nginx
    profiles: ["prod"]
    volumes:
      - ./ops/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on: [api]
    networks: [lumina]
    logging: *default-logging

  # 自部署嵌入模型服务（TEI / sentence-transformers）
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: lumina-embedding
    profiles: ["local-models"]
    environment:
      MODEL_ID: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - hf-cache:/data
    networks: [lumina]
    logging: *default-logging

  # 自部署 LoRA 微调后的意图识别模型
  vllm:
    image: vllm/vllm-openai:latest
    container_name: lumina-vllm
    profiles: ["local-models"]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - --model=${LLM_LOCAL_MODEL:-lumina-intent-lora}
      - --served-model-name=lumina-intent-lora
      - --port=8000
      - --max-model-len=4096
      - --gpu-memory-utilization=0.85
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [lumina]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    container_name: lumina-prom
    profiles: ["observability"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    networks: [lumina]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.0
    container_name: lumina-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    networks: [lumina]
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: lumina-otel
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./ops/otel/otel-collector.yaml:/etc/otel/config.yaml:ro
    networks: [lumina]
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  quickwitdata:
  esdata:
  promdata:
  grafanadata:
  hf-cache:

networks:
  lumina:
    driver: bridge
